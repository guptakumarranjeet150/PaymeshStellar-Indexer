services:
  postgres:
    image: postgres:16-alpine
    container_name: paymesh-indexer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paymesh
      POSTGRES_PASSWORD: paymesh
      POSTGRES_DB: paymesh_indexer
    ports:
      - "5432:5432"
    volumes:
      - paymesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymesh -d paymesh_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paymesh_pgdata:
